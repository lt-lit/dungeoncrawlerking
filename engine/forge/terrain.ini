# THE TERRAIN INTERPRETER (terrain.patch) - the forge's test variants: the deck's three boards with
# hammerPieceTypes = k (the sledge card gates it) and a card library covering every effect and targeting
# word: 1-4 ice (1 the legacy word), 10 portal, 20 win, 30 meta, 40-46 hits, 50-53 walls, 60-61 pits,
# 70-71 harden, 80 sledge, 90-91 drops.

[terrain8:chess]
